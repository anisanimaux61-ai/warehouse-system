<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - تعاونية الحبوب والبقول الجافة سطيف</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
        }
        .login-card { 
            max-width: 420px; 
            width: 100%; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.12); 
            border: none;
            background: #ffffff;
        }
        .logo-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="card login-card p-4">
        <div class="text-center mb-4">
            <!-- عرض الشعار -->
            <img src="/logo.png" alt="شعار التعاونية" class="logo-img">
            <!-- اسم المؤسسة -->
            <h5 class="fw-bold text-dark mb-1">تعاونية الحبوب والبقول الجافة</h5>
            <span class="badge bg-success mb-2">ولاية سطيف</span>
            <p class="text-muted small">بوابة إدارة وتوزيع الملفات والمهام</p>
        </div>
        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">البريد الإلكتروني</label>
                <input type="emailname" name="email" class="form-control" placeholder="example@gmail.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">كلمة المرور</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 fw-bold shadow-sm">تسجيل الدخول</button>
        </form>
    </div>
</body>
</html>
