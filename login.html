<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - تعاونية الحبوب والبقول الجافة - سطيف</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        /* خلفية صفحة تسجيل الدخول بنفس الصورة والترتيب الاحترافي */
        body {
            background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.88)), 
                        url('/bg.png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* تصميم صندوق تسجيل الدخول بشكل زجاجي أنيق (Glassmorphism) */
        .login-card {
            background: rgba(30, 41, 59, 0.88) !important;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 1rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            color: #f8fafc;
            padding: 2.5rem;
            width: 100%;
            max-width: 450px;
        }

        .form-control {
            background-color: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .form-control:focus {
            background-color: rgba(15, 23, 42, 0.95);
            color: #fff;
            border-color: #198754;
            box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25);
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        label {
            color: #f8fafc !important;
        }
    </style>
</head>
<body>

    <div class="login-card shadow-lg">
        <div class="text-center mb-4">
            <img src="/logo.png" alt="شعار التعاونية" style="width: 70px; height: auto;" class="mb-2">
            <h4 class="fw-bold text-white">تعاونية الحبوب والبقول الجافة</h4>
            <span class="badge bg-success px-3 py-1 mb-2">ولاية سطيف</span>
            <p class="text-muted small">بوابة إدارة وتوزيع الملفات والمهام</p>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label">البريد الإلكتروني</label>
                <input type="email" name="email" class="form-control" placeholder="example@gmail.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">كلمة المرور</label>
                <input type="password" name="password" class="form-control" placeholder="********" required>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold py-2">تسجيل الدخول</button>
        </form>
    </div>

</body>
</html>
