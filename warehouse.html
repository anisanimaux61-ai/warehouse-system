<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المخزن - تعاونية الحبوب والبقول الجافة - سطيف</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        /* خلفية إدارية احترافية متناسقة مع باقي أجزاء النظام */
        body {
            background: linear-gradient(rgba(15, 23, 42, 0.82), rgba(15, 23, 42, 0.88)), 
                        url('bg.png') no-repeat center center fixed;
            background-size: cover;
            color: #f8fafc;
            min-height: 100vh;
        }

        /* تصميم البطاقات بزجاجيات شفافة أنيقة (Glassmorphism) */
        .card {
            background: rgba(30, 41, 59, 0.85) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f8fafc;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .card h5, .card h6, .card label {
            color: #f8fafc !important;
        }

        /* تخصيص الجداول والعناصر لتتوافق مع المظهر الاحترافي الداكن */
        .table {
            color: #f8fafc;
            border-color: rgba(255, 255, 255, 0.1);
        }

        .table-light, .table-light th {
            background-color: rgba(51, 65, 85, 0.95) !important;
            color: #fff !important;
            border-color: rgba(255, 255, 255, 0.1);
        }

        .form-control, .form-select {
            background-color: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .form-control:focus, .form-select:focus {
            background-color: rgba(15, 23, 42, 0.95);
            color: #fff;
            border-color: #198754;
            box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25);
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.95) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark px-4 mb-4">
        <span class="navbar-brand fw-bold" id="warehouseTitle">🌾 لوحة تحكم المخزن</span>
        <div>
            <span class="text-info me-3" id="warehouseEmail"></span>
            <a href="/logout" class="btn btn-outline-light btn-sm">تسجيل الخروج</a>
        </div>
    </nav>

    <!-- تنبيه بصري متحرك يظهر عند وصول رسالة جديدة -->
    <div class="container" id="alertContainer"></div>

    <div class="container">
        <div class="row g-4">
            <!-- قسم إرسال تقرير أو ملف إلى المديرية أو مخزن آخر -->
            <div class="col-md-5">
                <div class="card shadow-sm p-4">
                    <h5 class="fw-bold mb-3 text-success">إرسال ملف أو تقرير</h5>
                    <form action="/warehouse/send-task" method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label">الجهة المرسل إليها</label>
                            <select name="target_email" id="recipientsSelect" class="form-select" required>
                                <option value="admin@admin.com">🏢 مقر المديرية (الرئيسي)</option>
                                <option value="all">📢 إلى الجميع</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">عنوان التقرير / الموضوع</label>
                            <input type="text" name="title" class="form-control" placeholder="مثال: تقرير المخزون اليومي" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">تفاصيل إضافية</label>
                            <textarea name="message" class="form-control" rows="3" placeholder="اكتب التفاصيل هنا..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">إرفاق ملف (PDF, Excel, صور...)</label>
                            <input type="file" name="file" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-bold">إرسال التقرير</button>
                    </form>
                </div>
            </div>

            <!-- جدول الواردات والملفات المرسلة للمخزن -->
            <div class="col-md-7">
                <div class="card shadow-sm p-4">
                    <h5 class="fw-bold mb-3">الملفات والتعليمات الواردة إليك</h5>
                    <div class="table-responsive">
                        <table class="table table-bordered align-middle">
                            <thead>
                                <tr class="table-light">
                                    <th>العنوان</th>
                                    <th>الملف المرفق</th>
                                    <th>التاريخ</th>
                                </tr>
                            </thead>
                            <tbody id="warehouseTasksTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- صوت تنبيه صغير يتم تشغيله تلقائياً عند وصول رسالة جديدة -->
    <audio id="alertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        let lastTaskCount = -1;

        function loadWarehouseData() {
            fetch('/warehouse/data')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('warehouseTitle').textContent = `مرحباً بك: ${data.name}`;
                    document.getElementById('warehouseEmail').textContent = data.email;

                    // تعبئة قائمة المستلمين
                    const select = document.getElementById('recipientsSelect');
                    select.innerHTML = '<option value="admin@admin.com">🏢 مقر المديرية (الرئيسي)</option><option value="all">📢 إلى الجميع</option>';
                    data.recipients.forEach(r => {
                        const opt = document.createElement('option');
                        opt.value = r.email;
                        opt.textContent = `📌 ${r.name} (${r.email})`;
                        select.appendChild(opt);
                    });

                    // فحص إذا وصلت مهمة جديدة لتنبيه العامل صوتاً وشكلاً
                    if (lastTaskCount !== -1 && data.tasks.length > lastTaskCount) {
                        // تشغيل صوت التنبيه
                        document.getElementById('alertSound').play().catch(e => console.log(e));
                        
                        // إظهار تنبيه مرئي ملون
                        const alertBox = document.getElementById('alertContainer');
                        alertBox.innerHTML = `
                            <div class="alert alert-warning alert-dismissible fade show fw-bold text-center shadow" role="alert">
                                🚨 تنبيه جديد! وصلك ملف أو تعليمة جديدة من المديرية أو فرع آخر!
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        `;
                    }
                    lastTaskCount = data.tasks.length;

                    // تعبئة جدول المهام الواردة
                    const tbody = document.getElementById('warehouseTasksTable');
                    tbody.innerHTML = '';
                    data.tasks.forEach(t => {
                        const fileLink = t.file_path ? `<a href="${t.file_path}" target="_blank" class="btn btn-sm btn-info text-white">فتح / تحميل</a>` : 'لا يوجد';
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><strong>${t.title}</strong><br><small class="text-light">${t.message || ''}</small></td>
                            <td>${fileLink}</td>
                            <td><small>${t.created_at}</small></td>
                        `;
                        tbody.appendChild(tr);
                    });
                });
        }

        // تحميل البيانات فور فتح الصفحة
        loadWarehouseData();

        // إعادة فحص سحب البيانات والرسائل تلقائياً كل 5 ثوانٍ في الخلفية
        setInterval(loadWarehouseData, 5000);
    </script>
</body>
</html>
