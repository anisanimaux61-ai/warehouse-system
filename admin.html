<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المديرية - تعاونية الحبوب والبقول الجافة - سطيف</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        /* استدعاء الخلفية بشكل مباشر من جذر مجلد public مع تعتيم زجاجي أنيق */
        body {
            background: linear-gradient(rgba(15, 23, 42, 0.82), rgba(15, 23, 42, 0.88)), 
                        url('/bg.png') no-repeat center center fixed;
            background-size: cover;
            color: #f8fafc;
            min-height: 100vh;
        }

        /* تصميم البطاقات بزجاجيات شفافة أنيقة لتبرز فوق الخلفية */
        .card {
            background: rgba(30, 41, 59, 0.85) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f8fafc;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .card h5, .card h6, .card label {
            color: #f8fafc !important;
        }

        /* تخصيص الجداول والعناصر لتتوافق مع المظهر الاحترافي */
        .table {
            color: #f8fafc;
            border-color: rgba(255, 255, 255, 0.1);
        }

        .table-light, .table-light th {
            background-color: rgba(51, 65, 85, 0.95) !important;
            color: #fff !important;
            border-color: rgba(255, 255, 255, 0.1);
        }

        .form-control, .form-select {
            background-color: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .form-control:focus, .form-select:focus {
            background-color: rgba(15, 23, 42, 0.95);
            color: #fff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        .list-group-item {
            background-color: transparent !important;
            color: #f8fafc;
            border-color: rgba(255, 255, 255, 0.1) !important;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.95) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark px-4 mb-4">
        <span class="navbar-brand fw-bold">🌾 لوحة تحكم مقر المديرية - تعاونية الحبوب والبقول الجافة - سطيف</span>
        <a href="/logout" class="btn btn-outline-light btn-sm">تسجيل الخروج</a>
    </nav>

    <div class="container">
        <div class="row g-4">
            <!-- قسم إرسال ملف أو عمل -->
            <div class="col-md-7">
                <div class="card shadow-sm p-4 mb-4">
                    <h5 class="fw-bold mb-3 text-info">إرسال ملف أو تعليمة عمل (PDF / Word)</h5>
                    <form action="/admin/send-task" method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label">الجهة المستلمة</label>
                            <select name="target_email" id="warehouseSelect" class="form-select" required>
                                <option value="all">📢 إرسال إلى جميع المخازن</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">عنوان الموضوع / العمل</label>
                            <input type="text" name="title" class="form-control" placeholder="مثال: جرد شهر نوفمبر أو تعليمة إدارية" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">تفاصيل الرسالة (اختياري)</label>
                            <textarea name="message" class="form-control" rows="3" placeholder="اكتب التعليمات هنا..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">إرفاق ملف (صورة، PDF، Word، Excel)</label>
                            <input type="file" name="file" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-bold">إرسال الآن</button>
                    </form>
                </div>
            </div>

            <!-- قسم إضافة مخزن جديد + إعدادات حساب المدير -->
            <div class="col-md-5">
                <!-- قسم إضافة مخزن جديد -->
                <div class="card shadow-sm p-4 mb-4">
                    <h5 class="fw-bold mb-3">إضافة حساب مخزن جديد</h5>
                    <form action="/admin/add-warehouse" method="POST">
                        <div class="mb-2">
                            <label class="form-label">اسم المخزن / الفرع</label>
                            <input type="text" name="name" class="form-control" placeholder="مثال: مخزن مزلوق 01" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">البريد الإلكتروني (Gmail)</label>
                            <input type="email" name="email" class="form-control" placeholder="branch1@gmail.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">كلمة السر الخاصة بالمخزن</label>
                            <input type="text" name="password" class="form-control" placeholder="اختر كلمة سر للمخزن" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">إنشاء حساب المخزن</button>
                    </form>
                </div>

                <!-- قسم إعدادات حساب المدير -->
                <div class="card shadow-sm p-4 mb-4">
                    <h5 class="fw-bold mb-3">إعدادات حساب المدير</h5>
                    <form action="/admin/update-profile" method="POST">
                        <div class="mb-2">
                            <label class="form-label">اسم المدير / المديرية</label>
                            <input type="text" name="name" id="adminNameInput" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">البريد الإلكتروني</label>
                            <input type="email" name="email" id="adminEmailInput" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">كلمة المرور الجديدة</label>
                            <input type="password" name="password" class="form-control" placeholder="اتركها فارغة إذا لم ترد تغييرها">
                        </div>
                        <button type="submit" class="btn btn-warning w-100 fw-bold text-dark">حفظ تعديلات الحساب</button>
                    </form>
                </div>

                <!-- قائمة المخازن المسجلة -->
                <div class="card shadow-sm p-3">
                    <h6 class="fw-bold mb-2">المخازن المسجلة</h6>
                    <ul class="list-group list-group-flush" id="warehousesList"></ul>
                </div>
            </div>
        </div>

        <!-- سجل الإرسالات السابقة -->
        <div class="card shadow-sm p-4 my-4">
            <h5 class="fw-bold mb-3">سجل الملفات والأعمال المرسلة</h5>
            <div class="table-responsive">
                <table class="table table-bordered align-middle">
                    <thead>
                        <tr class="table-light">
                            <th>العنوان</th>
                            <th>المستلم</th>
                            <th>الملف المرفق</th>
                            <th>التاريخ</th>
                            <th>إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="tasksTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        fetch('/admin/data')
            .then(res => res.json())
            .then(data => {
                if(data.email) {
                    document.getElementById('adminEmailInput').value = data.email;
                    document.getElementById('adminNameInput').value = data.name;
                }

                const select = document.getElementById('warehouseSelect');
                const list = document.getElementById('warehousesList');
                
                data.warehouses.forEach(w => {
                    const opt = document.createElement('option');
                    opt.value = w.email;
                    opt.textContent = `🏢 ${w.name} (${w.email})`;
                    select.appendChild(opt);

                    const li = document.createElement('li');
                    li.className = 'list-group-item d-flex justify-content-between align-items-center px-0';
                    li.innerHTML = `
                        <div><strong>${w.name}</strong><br><small class="text-info">${w.email}</small></div>
                        <form action="/admin/delete-warehouse/${w.id}" method="POST" onsubmit="return confirm('حذف هذا المخزن؟')">
                            <button class="btn btn-sm btn-outline-danger">حذف</button>
                        </form>
                    `;
                    list.appendChild(li);
                });

                const tbody = document.getElementById('tasksTable');
                data.tasks.forEach(t => {
                    const targetText = t.target_email === 'all' ? '<span class="badge bg-primary">جميع المخازن</span>' : t.target_email;
                    const fileLink = t.file_path ? `<a href="${t.file_path}" target="_blank" class="btn btn-sm btn-info text-white">فتح / تحميل</a>` : 'لا يوجد';
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${t.title}</strong><br><small class="text-light">${t.message || ''}</small></td>
                        <td>${targetText}</td>
                        <td>${fileLink}</td>
                        <td><small>${t.created_at}</small></td>
                        <td>
                            <form action="/admin/delete-task/${t.id}" method="POST" onsubmit="return confirm('حذف هذا الإرسال؟')">
                                <button class="btn btn-sm btn-danger">حذف</button>
                            </form>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
    </script>
</body>
</html>
